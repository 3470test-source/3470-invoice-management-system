<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Employee Task Management-System - Employee Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">

    <!-- Css styles -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    </style>

</head>
<body>


    <!-- Invoice Dashboard HEADER -->
    <header class="invoice-dashboard-header">

        <!-- LEFT -->
        <div class="left-header-invoice">

            <div class="logo-header-invoice">
                <img src="/image/Logo3470-health3-removebg-preview.png" alt="IMS Logo">
            </div>

            <div class="left-header-invoice-menu-btn" id="menuBtn">
                <i class="fa fa-bars"></i>
            </div>

        </div>

        <!-- CENTER -->
        <div class="header-invoice-center">
            INVOICE MANAGEMENT SYSTEM
        </div>

        <!-- RIGHT -->
        <div class="right-header-invoice">

            <div class="admin-profile-dropdown">

                <div class="admin-profile-btn right-header-invoice-profile" onclick="toggleDropdown()">

                <div class="right-header-avatar-icon">
                    <i class="fa fa-user"></i>
                </div>

                <span>Admin</span>

            </div>

            <!-- Profile -->
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#"><i class="fa fa-user"></i>My Profile</a>
                <a href="#"><i class="fa fa-cog"></i>Settings</a>
                <a href="admin-login.html"><i class="fa fa-sign-out-alt"></i>Logout</a>
            </div>

        </div>

    </div>

</header>

























<!-- Profile dropdown - JS -->
<script>
    function toggleDropdown() {

        document.getElementById("dropdownMenu").classList.toggle("show");

    }

window.onclick = function(event) {

    if (!event.target.closest(".admin-profile-dropdown")) {

        const dropdown =
            document.getElementById("dropdownMenu");

        dropdown.classList.remove("show");
    }
};
</script>


</body>
</html>
