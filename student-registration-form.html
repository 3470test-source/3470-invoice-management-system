<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Invoice Management System - Online Registration Form</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">

    <!-- Css styles -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
     
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:#eef3fb;
      padding:40px;   
    }

    </style>

</head>
<body>


    <div class="registration-container">

        <div class="std-reg-company-logo">
            <img src="image/Logo3470-health3-removebg-preview.png" alt="Company Logo">
        </div>

            <h2>Student Registration Form</h2>

            <p class="form-description">
                Kindly fill in the details below and submit the registration form.
            </p>

                <form action="/register" method="POST" enctype="multipart/form-data">

                    <!-- Basic Details -->
                    <div class="std-reg-form-section">
                        <h3>Basic Details</h3>

                        <div class="std-reg-form-grid">

                            <div class="std-reg-form-group">
                                <label>First Name</label>
                                <input type="text" name="first_name" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Last Name</label>
                                <input type="text" name="last_name" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Qualification</label>
                                <input type="text" name="qualification" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Contact Number</label>
                                <input type="tel" name="contact_number" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>WhatsApp Number</label>
                                <input type="tel" name="whatsApp_number">
                            </div>

                            <div class="std-reg-form-group">
                                <label>Email ID</label>
                                <input type="email" name="email_id" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Year of Passing</label>
                                <input type="number" name="year_passing" min="1990" max="2099">
                            </div>

                            <div class="std-reg-form-group">
                                <label>Course</label>
                                <select name="student-course" id="student-course" required>
                                    <option value="">-- Select Course --</option>
                                    <option value="BMCT">Basic Medical Coding Training</option>
                                    <option value="CPC">Certified Professional Coder</option>
                                    <option value="E&M">Evaluation & Management</option>
                                    <option value="IPDRG">Inpatient Diagnosis-Related Group</option>
                                    <option value="ED">Emergency Department</option>
                                    <option value="CCS">Certified Coding Specialist</option>
                                    <option value="CPMA">Certified Professional Medical Auditor</option>
                                    <option value="CRC">Certified Risk Adjustment Coder</option>
                                    <option value="Surgery">Surgery</option>
                                </select>    
                            </div>

                        </div>

                    </div>


                    <!-- Training Preference -->
                    <div class="std-reg-form-section">
                        <h3>Training Preference</h3>

                        <div class="std-reg-form-grid">

                            <div class="std-reg-form-group">
                                <label>Preferred Schedule</label>

                                <div class="std-reg-radio-group">
                                    <label><input type="radio" name="schedule" value="Weekdays"> Weekdays</label>
                                    <label><input type="radio" name="schedule" value="Weekends"> Weekends</label>
                                </div>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Preferred Timing</label>

                                <div class="std-reg-radio-group">
                                    <label><input type="radio" name="timing" value="Morning"> Morning</label>
                                    <label><input type="radio" name="timing" value="Evening"> Evening</label>
                                </div>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Mode of Class</label>

                                <div class="std-reg-radio-group">
                                    <label><input type="radio" name="mode" value="Online"> Online</label>
                                    <label><input type="radio" name="mode" value="Offline"> Offline</label>
                                </div>
                            </div>

                        </div>

                    </div>


                    <!-- Additional Details -->
                    <div class="std-reg-form-section">
                        <h3>Additional Details</h3>

                        <div class="std-reg-form-grid">

                            <div class="std-reg-form-group std-full-width">
                                <label>Current Address</label>
                                <textarea name="current_address"  rows="3"></textarea>
                            </div>

                            <div class="std-reg-form-group">
                                <label>City</label>
                                <input type="text" name="city">
                            </div>

                            <div class="std-reg-form-group">
                                <label>State</label>
                                <input type="text" name="state">
                            </div>

                            <div class="std-reg-form-group">
                                <label>Country</label>
                                <input type="text" name="country">
                            </div>

                            <div class="std-reg-form-group">
                                <label>Pin Code</label>
                                <input type="text" name="pin_code">
                            </div>

                            <div class="std-reg-form-group">
                                <label>Emergency Contact Number</label>
                                <input type="tel" name="emergency_number">
                            </div>

                        </div>

                    </div>


                    <!-- Medical Coding -->
                    <div class="std-reg-form-section">
                        <h3>Medical Coding Details</h3>

                        <div class="std-reg-form-group">
                            <label>Are you a coder?</label>

                        <div class="std-reg-radio-group">
                            <label><input type="radio" name="coder" value="Yes"> Yes</label>
                            <label><input type="radio" name="coder" value="No"> No</label>
                        </div>
                    </div>

                        <div class="std-reg-form-group">
                            <label>If Yes, Mention Domain</label>
                            <input type="text" name="coding_domain">
                        </div>

                    </div>


                    <!-- Uploads -->
                    <div class="std-reg-form-section">
                        <h3>Mandatory Uploads (Only Images Allowed)</h3>

                        <div class="std-reg-form-grid">

                            <div class="std-reg-form-group">
                                <label>Aadhaar Card</label>
                                <input type="file" name="aadhaar_card" accept="image/*" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>PAN Card</label>
                                <input type="file" name="pan_card" accept="image/*" required>
                            </div>

                            <div class="std-reg-form-group">
                                <label>Recent Casual Photo</label>
                                <input type="file" name="casual_photo" accept="image/*" required>
                            </div>

                        </div>

                    </div>


                <!-- Submit & rest Btn -->
                <div class="std-reg-button-group">
                    <button type="submit" class="std-reg-submit-btn">Submit Registration</button>
                    <button type="reset" class="std-reg-reset-btn">Reset</button>
                </div>

        </form>

    </div>



<script>
        const form = document.querySelector("form");

        const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";

form.addEventListener("submit", async function (e) {

    e.preventDefault();

    const data = {

        first_name: form.first_name.value,
        last_name: form.last_name.value,
        qualification: form.qualification.value,
        contact_number: form.contact_number.value,
        whatsApp_number: form.whatsApp_number.value,
        email_id: form.email_id.value,
        year_passing: form.year_passing.value,
        student_course: form.student_course.value,
        schedule: form.schedule.value,
        timing: form.timing.value,
        mode: form.mode.value,
        current_address: form.current_address.value,
        city: form.city.value,
        state: form.state.value,
        country: form.country.value,
        pin_code: form.pin_code.value,
        emergency_number: form.emergency_number.value,
        coder: form.coder.value,
        coding_domain: form.coding_domain.value
    };

    try {

        const response = await fetch(SCRIPT_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });

        const result = await response.json();

        if (result.status === "success") {

            alert("Registration submitted successfully.");

            form.reset();

        } else {

            alert("Submission failed.");

        }

    } catch (error) {

        console.error(error);

        alert("Error submitting form.");

    }

});
</script>


</body>
</html>
