<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Invoice Management-System - Admin login</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">

    <!-- Css styles -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    </style>

</head>
<body>


    <div class="admin-login-invoice">

        <!-- LEFT SIDE -->
        <div class="invoice-left-login">
            <img src="/image/Logo3470-health3-removebg-preview.png" alt="Invoice Logo">
            <h1>Invoice Management System</h1>
            <p>Create invoices, manage customers, track payments and generate reports.</p>
        </div>


        <!-- RIGHT SIDE-->
        <div class="invoice-right-login">
            <h2>Admin Login</h2>
            <p>Sign in to access the invoice dashboard</p>

            <form id="invoice-form-login" class="invoice-form-login">

                <input type="text" id="adminUser" placeholder="Username" required>

            <div class="invoice-login-password-wrapper">
                <input type="password" id="adminPass" placeholder="Password" required>

                <span class="invoice-lg-toggle-password" onclick="togglePassword()">
                    <i id="eyeIcon" class="fa-solid fa-eye"></i>
                </span>
            </div>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>



<!-- Password hide / unhide -->
<script>
    function togglePassword() {

    const passwordInput = document.getElementById("adminPass");
    const eyeIcon = document.getElementById("eyeIcon");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");

    } else {

        passwordInput.type = "password";

        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");

    }
}
</script>



<!-- login credentials - JS -->
<script>
document.getElementById("invoice-form-login").addEventListener("submit", function(event){

    event.preventDefault();

    const username = document.getElementById("adminUser").value;

    const password = document.getElementById("adminPass").value;

    /*--- Static Credentials ---*/
    if(username === "admin" &&
       password === "Invoice@123"){

        localStorage.setItem("invoiceAdminLoggedIn","true");

        window.location.href = "dashboard-invoice.html";

    }else{

        alert("Invalid Username or Password");

    }

});
</script>


</body>
</html>
