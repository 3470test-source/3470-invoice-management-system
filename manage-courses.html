<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Employee Task Management-System - Invoice Admin Dashboard - Manage Course Page</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">

    <!-- Css styles -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #c5d7ee;
    }

    </style>

</head>
<body>


    <!-- Invoice Dashboard HEADER -->
    <header class="invoice-dashboard-header">

        <!-- LEFT -->
        <div class="left-header-invoice">

            <div class="logo-header-invoice">
                <img src="/image/Logo3470-health3-removebg-preview.png" alt="IMS Logo">
            </div>

            <div class="left-header-invoice-menu-btn" id="menuBtn">
                <i class="fa fa-bars"></i>
            </div>

        </div>

        <!-- CENTER -->
        <div class="header-invoice-center">
            INVOICE MANAGEMENT SYSTEM
        </div>

        <!-- RIGHT -->
        <div class="right-header-invoice">

            <div class="invoice-admin-profile-dropdown">

                <div class="invoice-admin-profile-btn right-header-invoice-profile" onclick="toggleDropdown()">

                <div class="right-header-avatar-icon">
                    <i class="fa fa-user"></i>
                </div>

                <span>Admin Panel</span>

            </div>

            <!-- Profile -->
            <div class="invoice-dropdown-menu" id="dropdownMenu">
                <a href="#"><i class="fa fa-user"></i>My Profile</a>
                <a href="#"><i class="fa fa-cog"></i>Settings</a>
                <a href="admin-login.html"><i class="fa fa-sign-out-alt"></i>Logout</a>
            </div>

        </div>

    </div>

</header>


    <!-- Dashboard Side Bar -->
    <div class="Admin-side-bar-invoice">

        <!-- Dashboard Sidebar -->
        <aside class="invoice-admin-dsh-sidebar" id="sidebar">

            <a href="dashboard-invoice.html"><i class="fa fa-dashboard"></i> Dashboard</a>

            <!-- INVOICES -->
            <div class="in-admin-sidebar-task-dropdown">

                <div class="invoice-admin-side-bar-drop-btn">
                    <i class="fa fa-file-invoice"></i> Invoices
                    <i class="fa fa-angle-down icon-color"></i>
                </div>

                <div class="adminInvoice-side-bar-drop-content">
                    <a href="#"><i class="fa fa-plus-circle"></i> Create Invoice</a>
                    <a href="#"><i class="fa fa-file-alt"></i> Manage Invoices</a>
                    <a href="#"><i class="fa fa-download"></i> Download CSV</a>
                </div>

            </div>

            <!-- PRODUCTS -->
            <div class="in-admin-sidebar-task-dropdown">

                <div class="invoice-admin-side-bar-drop-btn">
                    <i class="fa fa-box"></i> Courses
                    <i class="fa fa-angle-down icon-color"></i>
                </div>

                <div class="adminInvoice-side-bar-drop-content">
                    <a href="add-course.html"><i class="fa fa-plus"></i> Add Course</a>
                    <a href="manage-courses.html"><i class="fa fa-cogs"></i> Manage Courses</a>
                </div>

            </div>

            <!-- CUSTOMERS -->
            <div class="in-admin-sidebar-task-dropdown">

                <div class="invoice-admin-side-bar-drop-btn">
                    <i class="fa fa-user-graduate"></i> Students
                    <i class="fa fa-angle-down icon-color"></i>
                </div>

                <div class="adminInvoice-side-bar-drop-content">
                    <a href="add-student.html"><i class="fa fa-user-plus"></i> Add Student</a>
                    <a href="manage-students.html"><i class="fa fa-users"></i> Manage Students</a>
                </div>

            </div>

            <!-- SYSTEM USERS -->
            <div class="in-admin-sidebar-task-dropdown">

                <div class="invoice-admin-side-bar-drop-btn">
                    <i class="fa fa-user-shield"></i> System Users
                    <i class="fa fa-angle-down icon-color"></i>
                </div>

                <div class="adminInvoice-side-bar-drop-content">
                    <a href="#"><i class="fa fa-user-plus"></i> Add User</a>
                    <a href="#"><i class="fa fa-users-cog"></i> Manage Users</a>
                </div>

            </div>

        </aside>







    </div>    


<!-- Dashboard sidebar dropdown - JS -->
<script>
    document.querySelectorAll(".invoice-admin-side-bar-drop-btn").forEach(button => {

    button.addEventListener("click", () => {

        button.parentElement.classList.toggle("active");

    });

});
</script>


<!-- Profile dropdown - JS -->
<script>
    function toggleDropdown() {

        document.getElementById("dropdownMenu").classList.toggle("show");

    }

window.onclick = function(event) {

    if (!event.target.closest(".invoice-admin-profile-dropdown")) {

        const dropdown =
            document.getElementById("dropdownMenu");

        dropdown.classList.remove("show");
    }
};
</script>


</body>
</html>
