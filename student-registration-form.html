<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3470 Healthcare & Invoice Management System - Online Registration Form</title>

    <!-- Favicon -->
    <link rel="icon" href="/image/Logo3470-health3-removebg-preview.png" type="image/x-icon">

    <!-- Css styles -->
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
     
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:#eef3fb;
      padding:40px;   
    }










    /* ===========================
   General Styles
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3fb;
    padding:40px;
}

/* ===========================
   Registration Container
=========================== */

.registration-container{
    max-width:1000px;
    margin:auto;
    background:#ffffff;
    border-radius:10px;
    padding:35px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

/* ===========================
   Company Logo
=========================== */

.company-logo{
    text-align:center;
    margin-bottom:20px;
}

.company-logo img{
    width:120px;
    height:auto;
}

/* ===========================
   Heading
=========================== */

.registration-container h2{
    text-align:center;
    color:#003366;
    margin-bottom:10px;
    font-size:30px;
}

.form-description{
    text-align:center;
    color:#666;
    margin-bottom:30px;
    font-size:16px;
}

/* ===========================
   Section
=========================== */

.form-section{
    margin-bottom:30px;
}

.form-section h3{
    background:#003366;
    color:#ffffff;
    padding:12px 18px;
    border-radius:6px;
    margin-bottom:20px;
    font-size:18px;
}

/* ===========================
   Grid
=========================== */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

/* ===========================
   Form Group
=========================== */

.form-group{
    display:flex;
    flex-direction:column;
}

.full-width{
    grid-column:1 / 3;
}

.form-group label{
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

/* ===========================
   Inputs
=========================== */

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;
    padding:12px;
    border:1px solid #cccccc;
    border-radius:6px;
    font-size:15px;
    outline:none;
    transition:.3s;

}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{

    border-color:#003366;
    box-shadow:0 0 6px rgba(0,51,102,.2);

}

textarea{

    resize:vertical;

}

/* ===========================
   Radio Buttons
=========================== */

.radio-group{

    display:flex;
    gap:25px;
    align-items:center;
    flex-wrap:wrap;
    margin-top:8px;

}

.radio-group label{

    font-weight:normal;
    display:flex;
    align-items:center;
    gap:6px;

}

/* ===========================
   File Upload
=========================== */

input[type="file"]{

    background:#f7f7f7;
    padding:10px;
    border:1px solid #cccccc;

}

/* ===========================
   Buttons
=========================== */

.button-group{

    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:30px;

}

.submit-btn{

    background:#003366;
    color:#ffffff;
    border:none;
    padding:14px 35px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;

}

.submit-btn:hover{

    background:#0055aa;

}

.reset-btn{

    background:#6c757d;
    color:#ffffff;
    border:none;
    padding:14px 35px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;

}

.reset-btn:hover{

    background:#555;

}

/* ===========================
   Responsive
=========================== */

@media(max-width:768px){

body{

    padding:15px;

}

.registration-container{

    padding:20px;

}

.form-grid{

    grid-template-columns:1fr;

}

.full-width{

    grid-column:auto;

}

.button-group{

    flex-direction:column;

}

.submit-btn,
.reset-btn{

    width:100%;

}

.radio-group{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
}

}




    </style>

</head>
<body>


    <div class="registration-container">

        <div class="company-logo">
            <img src="image/Logo3470-health3-removebg-preview.png" alt="Company Logo">
        </div>

            <h2>Student Registration Form</h2>

            <p class="form-description">
                Kindly fill in the details below and submit the registration form.
            </p>

                <form action="/register" method="POST" enctype="multipart/form-data">

                    <!-- Basic Details -->
                    <div class="form-section">
                        <h3>Basic Details</h3>

                        <div class="form-grid">

                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" name="first_name" placeholder="Enter First Name" required>
                            </div>

                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" name="last_name" required>
                            </div>

                            <div class="form-group">
                                <label>Qualification</label>
                                <input type="text" name="qualification" required>
                            </div>

                            <div class="form-group">
                                <label>Contact Number</label>
                                <input type="tel" name="contact_number" required>
                            </div>

                            <div class="form-group">
                                <label>WhatsApp Number</label>
                                <input type="tel" name="whatsApp_number">
                            </div>

                            <div class="form-group">
                                <label>Email ID</label>
                                <input type="email" name="email_id" required>
                            </div>

                            <div class="form-group">
                                <label>Year of Passing</label>
                                <input type="number" name="year_passing" min="1990" max="2099">
                            </div>

                        </div>

                    </div>


                    <!-- Training Preference -->
                    <div class="form-section">
                        <h3>Training Preference</h3>

                        <div class="form-grid">

                            <div class="form-group">
                                <label>Preferred Schedule</label>

                                <div class="radio-group">
                                    <label><input type="radio" name="schedule" value="Weekdays"> Weekdays</label>
                                    <label><input type="radio" name="schedule" value="Weekends"> Weekends</label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Preferred Timing</label>

                                <div class="radio-group">
                                    <label><input type="radio" name="timing" value="Morning"> Morning</label>
                                    <label><input type="radio" name="timing" value="Evening"> Evening</label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Mode of Class</label>

                                <div class="radio-group">
                                    <label><input type="radio" name="mode" value="Online"> Online</label>
                                    <label><input type="radio" name="mode" value="Offline"> Offline</label>
                                </div>
                            </div>

                        </div>

                    </div>


                    <!-- Additional Details -->
                    <div class="form-section">
                        <h3>Additional Details</h3>

                        <div class="form-grid">

                            <div class="form-group full-width">
                                <label>Current Address</label>
                                <textarea name="current_address"  rows="3"></textarea>
                            </div>

                            <div class="form-group">
                                <label>City</label>
                                <input type="text" name="city">
                            </div>

                            <div class="form-group">
                                <label>State</label>
                                <input type="text" name="state">
                            </div>

                            <div class="form-group">
                                <label>Country</label>
                                <input type="text" name="country">
                            </div>

                            <div class="form-group">
                                <label>Pin Code</label>
                                <input type="text" name="pin_code">
                            </div>

                            <div class="form-group">
                                <label>Emergency Contact Number</label>
                                <input type="tel" name="emergency_number">
                            </div>

                        </div>

                    </div>


                    <!-- Medical Coding -->
                    <div class="form-section">
                        <h3>Medical Coding Details</h3>

                        <div class="form-group">
                            <label>Are you a coder?</label>

                        <div class="radio-group">
                            <label><input type="radio" name="coder" value="Yes"> Yes</label>
                            <label><input type="radio" name="coder" value="No"> No</label>
                        </div>
                    </div>

                        <div class="form-group">
                            <label>If Yes, Mention Domain</label>
                            <input type="text" name="coding_domain">
                        </div>

                    </div>


                    <!-- Uploads -->
                    <div class="form-section">
                        <h3>Mandatory Uploads (Only Images Allowed)</h3>

                        <div class="form-grid">

                            <div class="form-group">
                                <label>Aadhaar Card</label>
                                <input type="file" name="aadhaar_card" accept="image/*" required>
                            </div>

                            <div class="form-group">
                                <label>PAN Card</label>
                                <input type="file" name="pan_card" accept="image/*" required>
                            </div>

                            <div class="form-group">
                                <label>Recent Casual Photo</label>
                                <input type="file" name="casual_photo" accept="image/*" required>
                            </div>

                        </div>

                    </div>


        


        <div class="button-group">
            <button type="submit" class="submit-btn">Submit Registration</button>
            <button type="reset" class="reset-btn">Reset</button>
        </div>


        

        

    </form>

</div>


</body>
</html>
